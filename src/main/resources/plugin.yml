name: StealSolo
author: Chaos
description: StealSolo plugin
version: '1.0'
main: fun.stealsolo.Stealsolo
api-version: '1.21'
softdepend: ["PlayerPoints", "PlaceholderAPI"]
commands:
  nightvision:
  permission: stealsolo.nightvision
    description: Toggle nightvision
    aliases:
      - nv
  paycoins:
    description: Pay coins to another player
    permission: stealsolo.paycoins
  stealsolo:
    description: StealSolo plugin
  trash:
    description: Trash items
    permission: stealsolo.trash
  media:
    description: announce a message as media
    permission: stealsolo.media
  ping:
    description: Check your own ping
    permission: stealsolo.ping

permissions:
  stealsolo.*:
    default: op
    children:
      - stealsolo.media
      - stealsolo.reload
      - stealsolo.trash
      - stealsolo.paycoins
      - stealsolo.ping
  stealsolo.media:
    default: op
  stealsolo.trash:
    default: true
  stealsolo.paycoins:
    default: true
  stealsolo.ping:
    default: true
  stealsolo.nightvision:
    default: true
  stealsolo.reload:
    default: op
