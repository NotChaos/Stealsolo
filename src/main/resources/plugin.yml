name: StealSolo
author: Chaos
description: StealSolo plugin
version: '${version}'
main: fun.stealsolo.Stealsolo
api-version: '1.21'
depend: ["WorldGuard", "packetevents"]
softdepend: ["PlayerPoints", "PlaceholderAPI", "HeadDatabase", "DeluxeCombat"]
commands:
  givekeepinventoryitem:
    description: Give an item that would normally be lost on death
    permission: stealsolo.givekeepinventoryitem
    aliases:
      - keepinventoryitem
      - keepinv
      - keepinventorycurrency
  nightvision:
    permission: stealsolo.nightvision
    description: Toggle nightvision
    aliases:
      - nv
  paycoins:
    description: Pay coins to another player
    permission: stealsolo.paycoins
  stealsolo:
    description: StealSolo plugin
  trash:
    description: Trash items
    permission: stealsolo.trash
  media:
    description: announce a message as media
    permission: stealsolo.media
  ping:
    description: Check your own ping
    permission: stealsolo.ping
  coinarea:
    description: Teleport to the AFK location
    permission: stealsolo.afk
  antipickup:
    description: Toggle anti-pickup
    aliases:
      - antipick
    permission: stealsolo.antipickup
  statistics:
    description: View StealSolo statistics
    aliases:
      - stats
      - statistic
      - playerstats
      - playerstatistics
  acceptbattle:
    description: Start a battle
    aliases:
      - accept1v1
      - 1v1accept
    permission: stealsolo.startbattle
  requestbattle:
    description: Request a battle with another player
    aliases:
      - 1v1
      - 1v1request
      - request1v1
    permission: stealsolo.startbattle
  denybattle:
    description: Deny a battle request
    aliases:
      - deny1v1
      - 1v1deny
    permission: stealsolo.startbattle
  addcustomenchant:
    description: Add a custom enchantment to an item
    aliases:
      - addenchant
      - customenchantment
    permission: stealsolo.addcustomenchant
  returncombatitems:
    description: Return items that were held due to combat limits
    aliases:
      - returnitems
    permission: stealsolo.returncombatitems

permissions:
  stealsolo.*:
    default: op
    children:
      - stealsolo.media
      - stealsolo.reload
      - stealsolo.trash
      - stealsolo.paycoins
      - stealsolo.ping
      - stealsolo.afk
      - stealsolo.antipickup
      - stealsolo.givekeepinventoryitem
      - stealsolo.startbattle
      - stealsolo.nightvision
      - stealsolo.addcustomenchant
  stealsolo.media:
    default: op
  stealsolo.trash:
    default: true
  stealsolo.paycoins:
    default: true
  stealsolo.ping:
    default: true
  stealsolo.nightvision:
    default: true
  stealsolo.reload:
    default: op
  stealsolo.afk:
    default: true
  stealsolo.antipickup:
    default: true
  stealsol.givekeepinventoryitem:
    default: op
  stealsolo.startbattle:
    default: true
  stealsolo.addcustomenchant:
    default: op
  stealsolo.returncombatitems:
    default: true
